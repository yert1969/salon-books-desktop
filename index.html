<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mane Frame Salon - Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <div class="login-header">
        <div class="logo">✂️</div>
        <h1>Mane Frame Salon</h1>
        <p class="tagline">Desktop Edition</p>
      </div>
      <button id="google-signin-btn" class="google-signin-btn">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" fill-rule="evenodd">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
            <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/>
            <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
          </g>
        </svg>
        Sign in with Google
      </button>
      <p class="login-note">Your data syncs with the mobile app</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="screen hidden">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-small">✂️</div>
        <h1 class="app-title">Mane Frame</h1>
        <span class="current-date" id="header-date"></span>
      </div>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="sign-out-btn" class="btn-secondary">Sign Out</button>
      </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="nav">
          <button class="nav-btn active" data-view="daily" onclick="navigate('daily')">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Daily</span>
          </button>
          <button class="nav-btn" data-view="monthly" onclick="navigate('monthly')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Monthly</span>
          </button>
          <button class="nav-btn" data-view="renters" onclick="navigate('renters')">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Renters</span>
          </button>
          <button class="nav-btn" data-view="reports" onclick="navigate('reports')">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Reports</span>
          </button>
          <button class="nav-btn" data-view="settings" onclick="navigate('settings')">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>
      </aside>

      <!-- Content Area -->
      <main class="content" id="content">
        <!-- Views will be rendered here -->
      </main>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Dexie.js -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>

  <!-- Chart.js for reports -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
